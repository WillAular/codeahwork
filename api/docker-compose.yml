version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: codeah_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: codeah_db
      MYSQL_USER: codeah_user
      MYSQL_PASSWORD: codeah_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
